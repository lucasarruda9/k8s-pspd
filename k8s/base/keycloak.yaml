apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: grupo-04
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.2
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pspd-secrets
                  key: keycloak-admin-password
            - name: KC_DB
              value: "dev-mem"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: grupo-04
data:
  pspd-realm.json: |
    {
      "realm": "pspd-realm",
      "enabled": true,
      "clients": [
        {
          "clientId": "frontend-client",
          "enabled": true,
          "publicClient": true,
          "redirectUris": ["http://localhost:3000/*", "http://localhost:5173/*"],
          "webOrigins": ["*"],
          "standardFlowEnabled": true
        }
      ],
      "roles": {
        "realm": [
          { "name": "medico" },
          { "name": "estagiario" },
          { "name": "pesquisador" }
        ]
      },
      "users": [
        {
          "username": "admin-pspd",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "pspd2026", "temporary": false }],
          "realmRoles": ["default-roles-pspd-realm"]
        },
        {
          "username": "dr.lucas",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "123", "temporary": false }],
          "realmRoles": ["medico"]
        },
        {
          "username": "estagiario.jose",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "123", "temporary": false }],
          "realmRoles": ["estagiario"]
        },
        {
          "username": "pesquisador.cientista",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "123", "temporary": false }],
          "realmRoles": ["pesquisador"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: grupo-04
spec:
  selector:
    app: keycloak
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
