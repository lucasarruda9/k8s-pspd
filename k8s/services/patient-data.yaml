apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-data
  namespace: grupo-04
  labels:
    app: patient-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-data
  template:
    metadata:
      labels:
        app: patient-data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: patient-data
          image: pspd/patient-data:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pspd-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pspd-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pspd-secrets
                  key: postgres-db
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: pspd-secrets
                  key: postgres-host
            - name: POSTGRES_PORT
              value: "5432"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-data
  namespace: grupo-04
spec:
  selector:
    app: patient-data
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patient-data-hpa
  namespace: grupo-04
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: patient-data
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
